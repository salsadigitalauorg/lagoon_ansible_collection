services:
  test:
    image: ghcr.io/salsadigitalauorg/ansible-test:latest
    volumes:
      - ./api:/usr/share/ansible/collections/ansible_collections/lagoon/api
    working_dir: /usr/share/ansible/collections/ansible_collections/lagoon/api

  graphql-mock:
    build:
      context: .
      dockerfile: .docker/Dockerfile.graphql-mock
    command: ["npm", "start"]
    ports:
      - 4000

  lint-docs:
    build:
      context: .
      dockerfile: .docker/Dockerfile.docs
      args:
        - OPERATION=lint
    volumes:
      - ./api:/collections/ansible_collections/lagoon/api
    working_dir: /collections/ansible_collections/lagoon/api
    command: ["antsibull-docs", "lint-collection-docs", "--plugin-docs", "."]

  docs:
    build:
      context: .
      dockerfile: .docker/Dockerfile.docs
    ports:
      - 9180:8000

  test-v3:
    image: ghcr.io/salsadigitalauorg/ansible-test:latest
    volumes:
      - .:/usr/share/ansible/collections/ansible_collections/salsadigitalauorg/lagoon
      # Mask the live .codegraph daemon socket -- it is a local dev artefact,
      # not part of the collection, and its UNIX socket file breaks tools
      # (e.g. antsibull-docs) that recursively copy the collection tree.
      - /usr/share/ansible/collections/ansible_collections/salsadigitalauorg/lagoon/.codegraph
    working_dir: /usr/share/ansible/collections/ansible_collections/salsadigitalauorg/lagoon

  lint-docs-v3:
    build:
      context: .
      dockerfile: .docker/Dockerfile.docs
      args:
        - OPERATION=lint
    volumes:
      - .:/collections/ansible_collections/salsadigitalauorg/lagoon
      - /collections/ansible_collections/salsadigitalauorg/lagoon/.codegraph
    working_dir: /collections/ansible_collections/salsadigitalauorg/lagoon
    command: ["antsibull-docs", "lint-collection-docs", "--plugin-docs", "."]

  # Serves the vendored v3 SDL (schema/lagoon-2.33.0.graphql), not the v1
  # api/tests/common/schema.graphql the plain `graphql-mock` service above
  # still points at. Distinct host port so both can run at once during
  # the v1-to-v3 migration period.
  graphql-mock-v3:
    build:
      context: .
      dockerfile: .docker/Dockerfile.graphql-mock-v3
    command: ["npm", "start"]
    ports:
      - "4200:4000"

  # codegen/ depends on graphql-core, a generator-only dev dependency that
  # must never reach the environment running the shipped collection's own
  # unit tests. This container has no ansible-core and shares no base image
  # or requirements file with test-v3, so that isolation is structural, not
  # just documented.
  codegen-v3:
    build:
      context: .
      dockerfile: .docker/Dockerfile.codegen-v3
    volumes:
      - .:/work
    working_dir: /work
    command: ["pytest", "codegen/tests", "-v"]
