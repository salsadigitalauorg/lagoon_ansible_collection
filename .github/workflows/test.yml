name: Run ansible-test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: ghcr.io

jobs:
  ansible-test:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          path: 'ansible_collections/lagoon'

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install ansible pytest pytest-forked

      - name: Run unit tests
        run: ansible-test units -v --requirements --python ${{ matrix.python-version }}
        working-directory: ./ansible_collections/lagoon/api

      - name: Publish test report
        uses: mikepenz/action-junit-report@v3
        if: always()
        with:
          check_name: ansible-test (${{ matrix.python-version }}) results
          report_paths: 'ansible_collections/lagoon/api/tests/output/junit/*.xml'
          detailed_summary: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: ansible_collections/lagoon/api/tests/output/junit/*.xml
        # Use always() to publish test results even when there are failures.
        if: ${{ always() }}

  # gql 4 changed gql()/dsl_gql() to return a GraphQLRequest instead of a
  # DocumentNode. Runs separately from ansible-test because gql 4.4 dropped
  # Python 3.9, which the main matrix still covers, and because it must skip
  # --requirements so it isn't silently downgraded back to the gql<4 pin in
  # tests/unit/requirements.txt.
  ansible-test-gql4:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: [ '3.11' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          path: 'ansible_collections/lagoon'

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install ansible pytest pytest-forked
          python -m pip install -r tests/unit/requirements.txt
          python -m pip install 'gql[requests]>=4,<5'
        working-directory: ./ansible_collections/lagoon/api

      - name: Show resolved gql version
        run: python -m pip show gql
        working-directory: ./ansible_collections/lagoon/api

      - name: Run unit tests
        run: ansible-test units -v --python ${{ matrix.python-version }}
        working-directory: ./ansible_collections/lagoon/api

      - name: Publish test report
        uses: mikepenz/action-junit-report@v3
        if: always()
        with:
          check_name: ansible-test-gql4 (${{ matrix.python-version }}) results
          report_paths: 'ansible_collections/lagoon/api/tests/output/junit/*.xml'
          detailed_summary: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-gql4-${{ matrix.python-version }}
          path: ansible_collections/lagoon/api/tests/output/junit/*.xml
        if: ${{ always() }}
